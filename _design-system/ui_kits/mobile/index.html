<!-- @dsCard group="UI kits" viewport="1600x900" name="Mobile" subtitle="4 iOS screens" -->
<!doctype html>
<html><head>
<meta charset="utf-8">
<title>syn.horse — mobile</title>
<link rel="stylesheet" href="../../styles.css">
<style>
* { box-sizing: border-box; margin:0; padding:0; }
html, body { background: #0a0014; min-height: 100vh; font-family: var(--font-body); color: var(--paper); }
body { display:flex; align-items:center; justify-content: center; padding: 24px; }
.stage { display:flex; gap: 28px; align-items:flex-start; flex-wrap: wrap; justify-content:center; }
.label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: .12em; text-transform: uppercase; text-align:center; margin-top: 8px; }
.fx-scan { position:fixed; inset:0; pointer-events:none; z-index:9999; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0, rgba(255,255,255,.03) 1px, transparent 1px, transparent 3px); }
.fx-grain { position:fixed; inset:0; pointer-events:none; z-index:9998; opacity: .03; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
/* mobile-only chrome; primitives come from the design system */
.m-screen { background: var(--bg); height: 100%; color: var(--paper); display:flex; flex-direction:column; }
.m-header { padding: 14px 18px 6px; display:flex; align-items:center; gap: 10px; border-bottom: 1px solid var(--void-4); }
.m-header h1 { font-family: var(--font-display); font-size: 32px; line-height: 1.1; flex:1; font-weight: 400; }
.icon-btn { width: 32px; height: 32px; display:grid; place-items:center; border:1px solid var(--void-4); background: transparent; color: var(--paper-2); font-size: 14px; }
.m-body { flex:1; overflow-y: auto; padding: 12px; display:flex; flex-direction: column; gap: 10px; }
.m-tabbar { display:flex; border-top: 1px solid var(--void-4); background: rgba(13,2,33,.7); backdrop-filter: blur(12px); }
.m-tabbar button { flex:1; padding: 10px 0 14px; background: transparent; border: 0; color: var(--fg-3); font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; display:flex; flex-direction:column; align-items:center; gap: 4px; cursor: pointer; }
.m-tabbar button::before { content: ''; width: 24px; height: 2px; background: transparent; margin-bottom: 4px; }
.m-tabbar button.active { color: var(--hot); }
.m-tabbar button.active::before { background: var(--hot); box-shadow: 0 0 8px var(--hot); }
.crumb { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: .08em; text-transform: uppercase; }
.m-title { font-family: var(--font-display); font-size: 36px; line-height: 1.15; font-weight: 400; }
.m-text { font-size: 13px; color: var(--paper-2); line-height: 1.55; }
.m-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.m-grid div { aspect-ratio: 1; background: var(--void-2); border: 1px solid var(--void-4); display:grid; place-items:center; font-family: var(--font-mono); font-size: 9px; color: var(--fg-3); }
.m-avatar { width: 80px; height: 80px; background: var(--void-2); border: 2px solid var(--hot); display:grid; place-items:center; }
.m-section-h { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); margin-top: 8px; }
.m-row { display:flex; align-items:center; padding: 12px 0; border-bottom: 1px solid var(--void-4); font-size: 13px; }
.m-row .arrow { margin-left: auto; color: var(--fg-3); font-family: var(--font-mono); }
.danger { color: var(--danger); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.row { display:flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="fx-grain"></div>
<div class="fx-scan"></div>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" data-presets="env,react">
const { useState } = React;
const { Card, Tag, Field, Marquee, StatStrip } = window.SynHorseDesignSystem_7004e4;

const VIS_TONE = { public: 'hot', private: 'cool' };
const SYNTHS = [
  { id: 'SY-0421', title: 'my entire posting history', desc: 'unhinged screenshots and drafts. updated whenever you press a wrong button.', vis: 'public', count: '421' },
  { id: 'SY-0188', title: 'thoughts at 3am', desc: 'do not open. if you opened it, do not read.', vis: 'private', count: '12' },
  { id: 'SY-0099', title: 'screenshots of error messages i found beautiful', desc: 'a curated gallery. yes, even the kernel panic.', vis: 'public', count: '88' },
  { id: 'SY-0042', title: 'the void ledger', desc: "a running list of things i meant to post and didn't.", vis: 'draft', count: '42' },
];

function TabBar({ active }) {
  const tabs = [{ id:'feed', l:'feed' }, { id:'detail', l:'read' }, { id:'compose', l:'new' }, { id:'profile', l:'me' }];
  return <div className="m-tabbar">{tabs.map(t => <button key={t.id} className={active===t.id ? 'active' : ''}>{t.l}</button>)}</div>;
}

function Header({ left, title, right, small }) {
  return (
    <div className="m-header">
      {left && <button className="icon-btn">{left}</button>}
      <h1 style={small ? { fontSize: 22 } : null}>{title}</h1>
      {right && <button className="icon-btn">{right}</button>}
    </div>
  );
}

function FeedScreen({ onOpen }) {
  return (
    <div className="m-screen">
      <Header title="your void" right="+" />
      <Marquee duration={24} items={[{ text: '◆ 421 synths', tone: 'hot' }, { text: 'warn: vibes nominal', tone: 'warn' }, 'tap + to make something']} style={{ fontSize: 10 }} />
      <div className="m-body">
        {SYNTHS.map(s => (
          <Card key={s.id} size="sm" id={s.id} title={s.title} description={s.desc}
            tags={[{ label: s.vis, tone: VIS_TONE[s.vis] }, { label: s.count + ' items' }]} onClick={() => onOpen(s)} />
        ))}
      </div>
    </div>
  );
}

function DetailScreen({ synth }) {
  const s = synth || SYNTHS[0];
  return (
    <div className="m-screen">
      <Header left="←" title={s.id} right="⋯" small />
      <div className="m-body" style={{ padding: 18, gap: 14 }}>
        <div className="crumb">/ void / {s.id}</div>
        <div className="m-title">{s.title}</div>
        <div className="row"><Tag tone={VIS_TONE[s.vis]}>{s.vis}</Tag><Tag>{s.count} items</Tag><Tag>3m ago</Tag></div>
        <div className="m-text">{s.desc}</div>
        <div className="m-grid">{Array.from({ length: 6 }).map((_, i) => <div key={i}>[ image: TODO ]</div>)}</div>
        <div className="m-text" style={{ borderTop: '1px solid var(--void-4)', paddingTop: 14 }}>
          owned by <span style={{ color: 'var(--hot)' }}>@horse.dril</span> · saved <span style={{ color: 'var(--cool)' }}>2024-08-11</span>
        </div>
      </div>
    </div>
  );
}

function ComposeScreen() {
  return (
    <div className="m-screen">
      <Header left="×" title="new synth" right="▶" small />
      <div className="m-body" style={{ padding: '14px 16px' }}>
        <Field placeholder="title — say something cursed" />
        <Field multiline rows={7} placeholder="thoughts at 3am go here. nobody is reading. that's the deal." hint="markdown ok. emoji are not. · 0 / 4096" />
        <div className="row"><Tag tone="hot">public</Tag><Tag>private</Tag><Tag>friends</Tag></div>
      </div>
    </div>
  );
}

function ProfileScreen() {
  return (
    <div className="m-screen">
      <Header title="me" right="⚙" />
      <div className="m-body" style={{ padding: 18, gap: 10 }}>
        <div className="m-avatar"><svg width="48" height="48" style={{ color: 'var(--hot)' }}><use href="../../assets/icons/pixel-sprites.svg#px-horse" /></svg></div>
        <div className="m-title" style={{ fontSize: 32 }}>@horse.dril</div>
        <div className="m-text">i used to be normal. then i became a synth.</div>
        <StatStrip size="sm" align="center" items={[{ value: '421', label: 'synths' }, { value: '12.4k', label: 'seen', tone: 'cool' }, { value: '3', label: 'drafts', tone: 'warn' }]} />
        <div className="m-section-h">account</div>
        <div>
          <div className="m-row"><span>edit handle</span><span className="arrow">›</span></div>
          <div className="m-row"><span>display name</span><span className="arrow">›</span></div>
          <div className="m-row"><span>bio</span><span className="arrow">›</span></div>
        </div>
        <div className="m-section-h" style={{ color: 'var(--danger)' }}>danger zone</div>
        <div>
          <div className="m-row"><span className="danger">export everything</span><span className="arrow">›</span></div>
          <div className="m-row" style={{ borderColor: 'var(--danger)' }}><span className="danger">delete account</span><span className="arrow">›</span></div>
        </div>
        <div style={{ textAlign: 'center', marginTop: 14, fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--fg-3)' }}>you're still scrolling. it's fine.</div>
      </div>
    </div>
  );
}

function App() {
  const [synth, setSynth] = useState(null);
  const SCREENS = {
    feed: <FeedScreen onOpen={setSynth} />,
    detail: <DetailScreen synth={synth} />,
    compose: <ComposeScreen />,
    profile: <ProfileScreen />,
  };
  const LABELS = { feed:'01 Feed', detail:'02 Detail', compose:'03 Compose', profile:'04 Profile' };
  return (
    <div className="stage">
      {Object.keys(SCREENS).map(k => (
        <div key={k} data-screen-label={LABELS[k]}>
          <IOSDevice dark={true} width={340} height={720} keyboard={k==='compose'}>
            <div style={{ display:'flex', flexDirection:'column', height:'100%' }}>
              <div style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column' }}>{SCREENS[k]}</div>
              <TabBar active={k} />
            </div>
          </IOSDevice>
          <div className="label">{LABELS[k]}</div>
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
